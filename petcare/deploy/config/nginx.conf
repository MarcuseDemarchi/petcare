# Nginx das EC2 de aplicação: serve o frontend React e faz proxy da API Go local.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1m;

    # IP real do cliente vem do ALB (dentro da VPC)
    set_real_ip_from 10.20.0.0/16;
    real_ip_header   X-Forwarded-For;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/petcare;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'" always;

        location = /health       { proxy_pass http://127.0.0.1:8080/health; access_log off; }
        location = /health/ready { proxy_pass http://127.0.0.1:8080/health/ready; access_log off; }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # "expires" define Cache-Control sem sobrescrever os cabeçalhos de segurança
        location /assets/ {
            expires 1y;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
